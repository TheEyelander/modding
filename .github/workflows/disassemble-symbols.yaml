name: Disassemble Symbols
on:
  workflow_dispatch:
    inputs:
      stuff:
        description: Stuff
        required: true

jobs:
  disassemble-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble symbols
        run: |
          curl -fsSLOJ -w "%{filename_effective}" "https://github.com/TheEyelander/public/releases/download/roblox/libroblox.so"
          llvm-objdump-18 -d --no-leading-addr --no-show-raw-insn ${{ inputs.stuff }} libroblox.so | grep -B 2 -A 4 "#0xf2c" > "${{ github.job }}.txt"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
