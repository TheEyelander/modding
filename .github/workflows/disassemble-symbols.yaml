name: Disassemble Symbols
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true
      extra-arguments:
        description: Extra arguments

jobs:
  disassemble-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble symbols
        run: llvm-objdump-18 -d --no-leading-addr --no-show-raw-insn ${{ inputs.extra-arguments }} "$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")" > "${{ github.job }}.txt"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
