name: Disassemble Symbols
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true
      start-address:
        description: Start address
        required: true
      stop-address:
        description: Stop address
        required: true

jobs:
  disassemble-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble symbols
        run: llvm-objdump-18 -d --no-leading-addr --no-show-raw-insn --start-address="${{ inputs.start-address }}" stop-address="${{ inputs.stop-address }}" "$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")" > "${{ github.job }}.txt"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
