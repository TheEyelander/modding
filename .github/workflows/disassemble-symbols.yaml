name: Disassemble Symbols
on: workflow_dispatch

jobs:
  disassemble-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Disassemble symbols
        run: |
          curl -fsSLOJ -w "%{filename_effective}" "https://github.com/TheEyelander/public/releases/download/roblox/libroblox.so"
          llvm-objdump-18 -d libroblox.so | grep -B 10 -A 15 "0x3af000"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
