name: Build LuaJIT
on: workflow_dispatch

jobs:
  build-luajit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: LuaJIT/LuaJIT

      - name: Build LuaJIT
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make amalg libluajit.a \
            BUILDMODE=static \
            STATIC_CC="$bin/aarch64-linux-android21-clang" \
            TARGET_AR="$bin/llvm-ar rcus"

      - name: Upload
        uses: actions/upload-artifact@main
        with: 
          archive: false
          path: libluajit.a
