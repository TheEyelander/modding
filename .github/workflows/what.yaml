name: Compress File
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true
      input-cookies:
        description: Input cookies

jobs:
  compress-file:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: zip -qd "$(curl -fsSLOJ -w "%{filename_effective}" -b "${{ inputs.input-cookies }}" "${{ inputs.input-url }}")" "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*" || true

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: compress-file
          path: .
