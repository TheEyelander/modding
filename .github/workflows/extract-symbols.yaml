name: Extract Symbols
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true

jobs:
  extract-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Extract symbols
        run: llvm-nm-18 -D -f posix "$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")" > extract-symbols.txt

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: extract-symbols.txt
