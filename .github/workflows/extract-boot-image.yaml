name: Extract Boot Image
on:
  workflow_dispatch:
    inputs:
     fastboot-rom-url:
        description: Fastboot ROM URL
        required: true

jobs:
  extract-boot-image:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          curl -fsSL "${{ inputs.fastboot-rom-url }}" | tar -xz -f - --occurrence --wildcards "*/images/boot.img"
          7z a -m0=lzma2 -mx=9 boot-image.7z */images/boot.img

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: boot-image.7z
