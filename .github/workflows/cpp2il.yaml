name: Cpp2IL
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true

jobs:
  cpp2il:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          unzip -q "$(curl -fsSLOJ -w "%{filename_effective}" "https://nightly.link/SamboyCoding/Cpp2IL/workflows/dotnet-core/development/Cpp2IL-net9-linux-x64.zip")"
          input="$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")"

          chmod +x Cpp2IL
          ./Cpp2IL --game-path "$input" --output-as isil

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: cpp2il
          path: cpp2il_out
