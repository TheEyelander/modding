name: Build OpenResty's LuaJIT 2
on: workflow_dispatch

jobs:
  build-openresty-luajit-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          repository: openresty/luajit2

      - name: Build OpenResty's LuaJIT 2 (armeabi-v7a)
        run: |
          sudo apt-get install gcc-multilib

          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/armv7a-linux-androideabi21-clang"

          make clean
          make amalg \
            HOST="gcc -m32" \
            STATIC_CC="$cc" \
            DYNAMIC_CC="$cc -fPIC" \
            TARGET_LD="$cc" \
            TARGET_AR="$bin/llvm-ar rcus" \
            TARGET_STRIP="$bin/llvm-strip"

          mkdir armeabi-v7a
          mv src/libluajit.* armeabi-v7a

      - name: Build OpenResty's LuaJIT 2 (arm64-v8a)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/aarch64-linux-android21-clang"

          make clean
          make amalg \
            HOST="gcc" \
            STATIC_CC="$cc" \
            DYNAMIC_CC="$cc -fPIC" \
            TARGET_LD="$cc" \
            TARGET_AR="$bin/llvm-ar rcus" \
            TARGET_STRIP="$bin/llvm-strip"

          mkdir arm64-v8a
          mv src/libluajit.* arm64-v8a

      - name: Upload
        uses: actions/upload-artifact@main
        with: 
          name: ${{ github.job }}
          path: |
            armeabi-v7a
            arm64-v8a
