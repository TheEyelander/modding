name: LLVM Objdump
on:
  workflow_dispatch:
    inputs:
      input_url:
        description: Input URL
        required: true
      start-address:
        description: Start address
        required: true
      stop-address:
        description: Stop address
        required: true

jobs:
  llvm-objdump:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          input="$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input_url }}")"
          zstd -d "$input"

          llvm-objdump-18 -d "${input%.zst}" --no-leading-addr --no-show-raw-insn --start-address="${{ inputs.start-address }}" --stop-address="${{ inputs.stop-address }}" | sed -E 's/^[ \t]+//; s/[ \t]+/ /g' > llvm-objdump.txt

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: llvm-objdump.txt
