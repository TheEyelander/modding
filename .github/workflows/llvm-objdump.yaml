name: LLVM Objdump
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to the .so file
        required: true
      start-address:
        description: Start address
        required: true
      stop-address:
        description: Stop address
        required: true

jobs:
  llvm-objdump:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        run: |
          curl -fsSLOJ "${{ inputs.url }}"
          zstd -d *.so.zst

          llvm-objdump-18 -d *.so --no-leading-addr --no-show-raw-insn --start-address="${{ inputs.start-address }}" --stop-address="${{ inputs.stop-address }}" | sed -E 's/^[ \t]+//; s/[ \t]+/ /g' > llvm-objdump.txt

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: llvm-objdump.txt
